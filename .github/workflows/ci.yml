name: CI/CD Pipeline

on:
  push:
    branches: [ gubio ]
  pull_request:
    branches: [ gubio ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 app.py --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Build Docker image
      run: docker build -t ghcr.io/juangubio/gubio:latest .

    - name: Test Docker image
      run: |
        docker run -d --name test-app -p 8080:8080 ghcr.io/juangubio/gubio:latest
        sleep 10
        curl -f http://localhost:8080 || exit 1
        docker stop test-app
  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: juangubio
        password: ${{ secrets.GHCR_PAT }}

    - name: Build and push Docker image
      run: |
        docker build -t ghcr.io/juangubio/gubio:latest .
        docker push ghcr.io/juangubio/gubio:latest

    - name: Copiar stack.yml al VPS (SCP)
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/deploy"

    - name: 🚀 Deploy con eliminación del stack
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          cd ~/deploy

          # Login a GitHub Container Registry
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u juangubio --password-stdin

          # Descargar la nueva imagen
          docker pull ghcr.io/juangubio/gubio:latest

          # Borrar el stack SIEMPRE (si no existe no falla)
          docker stack rm gubio || true

          # Pequeña espera mientras Swarm libera recursos
          sleep 10

          # Crear el nuevo stack limpio
          docker stack deploy --with-registry-auth -c stack.yml gubio

          # Estado final del despliegue
          docker service ls
          docker stack ps gubio
