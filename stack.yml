version: "3.8"

services:
  gubio:
    image: ghcr.io/juangubio/mi-aplicacion:latest
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"

        # --- Router HTTP (redirección a HTTPS) ---
        - "traefik.http.routers.gubio.rule=Host(`gubio.byronrm.com`)"
        - "traefik.http.routers.gubio.entrypoints=web"
        - "traefik.http.middlewares.gubio-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.gubio.middlewares=gubio-https-redirect"

        # --- Router HTTPS ---
        - "traefik.http.routers.gubio-secure.rule=Host(`gubio.byronrm.com`)"
        - "traefik.http.routers.gubio-secure.entrypoints=websecure"
        - "traefik.http.routers.gubio-secure.tls=true"
        - "traefik.http.routers.gubio-secure.tls.certresolver=myresolver"
        - "traefik.http.routers.gubio-secure.service=gubio"

        # --- Puerto interno del contenedor ---
        - "traefik.http.services.gubio.loadbalancer.server.port=8080"

        # --- Red de Traefik ---
        - "traefik.docker.network=traefik-public"

    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
